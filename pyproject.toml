[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-chat-ai"
version = "0.1.0"
description = "Voice assistant pipeline with Whisper STT, retrieval, and TTS adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "imageio-ffmpeg>=0.4.9",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
