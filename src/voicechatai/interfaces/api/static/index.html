<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Chat AI</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 24px;
            max-width: 860px;
            margin: 0 auto;
        }

        /* ── Header ── */
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #status-badge {
            font-size: 0.82rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        #status-badge.disconnected { background: #21262d; color: #6e7681; }
        #status-badge.connecting   { background: #1f3a4a; color: #388bfd; animation: pulse 1s infinite; }
        #status-badge.ready        { background: #1f4a2f; color: #3fb950; }
        #status-badge.recording    { background: #4a1f1f; color: #f85149; animation: pulse 1s infinite; }
        #status-badge.processing   { background: #1f3a4a; color: #388bfd; animation: pulse 1s infinite; }
        #status-badge.error        { background: #4a261f; color: #f0883e; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ── Panel ── */
        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .panel h2 {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8b949e;
            margin-bottom: 12px;
        }

        /* ── Pipeline visualizer ── */
        .pipeline {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0;
            row-gap: 8px;
        }
        .pipe-node {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #6e7681;
            white-space: nowrap;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .pipe-node small {
            display: block;
            font-weight: 400;
            font-size: 0.65rem;
            opacity: 0.75;
            margin-top: 1px;
        }
        .pipe-node.active {
            background: #1f3a4a;
            border-color: #388bfd;
            color: #79c0ff;
            box-shadow: 0 0 0 1px #388bfd44;
            animation: pulse 1s infinite;
        }
        .pipe-node.done {
            background: #1f4a2f;
            border-color: #3fb950;
            color: #56d364;
            animation: none;
        }
        .pipe-arrow {
            color: #30363d;
            padding: 0 6px;
            user-select: none;
            font-size: 1rem;
        }

        /* ── Controls ── */
        .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .mic-timer {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            color: #6e7681;
            min-width: 42px;
        }
        .mic-timer.active { color: #f85149; }

        button {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 7px 16px;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
        }
        button:hover:not(:disabled) { background: #30363d; border-color: #8b949e; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        button.primary  { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        button.primary:hover:not(:disabled) { background: #388bfd; }
        button.rec      { background: #4a1f1f; border-color: #f85149; color: #ffa198; }
        button.sm       { padding: 3px 8px; font-size: 0.74rem; }

        /* ── Error ── */
        .error-msg {
            background: #2d1414;
            border: 1px solid #da3633;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #f85149;
            margin-bottom: 16px;
            display: none;
        }

        /* ── Result ── */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 580px) { .result-grid { grid-template-columns: 1fr; } }

        .rbox {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
        }
        .rbox.span2 { grid-column: 1 / -1; }
        .rbox label {
            display: block;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6e7681;
            margin-bottom: 6px;
        }
        .rbox p { font-size: 0.9rem; color: #e6edf3; line-height: 1.55; min-height: 1.4em; }

        .decision-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .decision-badge.hit      { background: #1f4a2f; color: #3fb950; }
        .decision-badge.clarify  { background: #3a2f00; color: #e3b341; }
        .decision-badge.fallback { background: #1f2a4a; color: #79c0ff; }
        .decision-badge.none     { background: #21262d; color: #6e7681; }

        .score-wrap { margin-top: 6px; }
        .score-bg   { background: #21262d; border-radius: 4px; height: 5px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 4px; background: #388bfd; transition: width 0.5s ease; }
        .score-val  { font-family: 'Consolas', monospace; font-size: 0.85rem; color: #c9d1d9; }

        .clarify-list { list-style: none; margin-top: 4px; }
        .clarify-list li { font-size: 0.87rem; color: #e3b341; padding: 2px 0; }
        .clarify-list li::before { content: '? '; color: #6e7681; }

        audio { width: 100%; margin-top: 8px; accent-color: #388bfd; }
    </style>
</head>
<body>

    <h1>
        Voice Chat AI
        <span id="status-badge" class="disconnected">● Disconnected</span>
    </h1>

    <!-- Pipeline -->
    <div class="panel">
        <h2>Pipeline</h2>
        <div class="pipeline">
            <div class="pipe-node" id="step-stt">🎙 STT<small>Speech → Text</small></div>
            <span class="pipe-arrow">→</span>
            <div class="pipe-node" id="step-embed">🔢 Embed<small>Text → Vector</small></div>
            <span class="pipe-arrow">→</span>
            <div class="pipe-node" id="step-vector">🗄 Vector DB<small>Similarity Search</small></div>
            <span class="pipe-arrow">→</span>
            <div class="pipe-node" id="step-rag">🧠 RAG<small>HIT / CLARIFY / MISS</small></div>
            <span class="pipe-arrow">→</span>
            <div class="pipe-node" id="step-tts">🔊 TTS<small>Text → Audio</small></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="panel">
        <h2>Microphone</h2>
        <div class="controls">
            <button class="primary" id="btn-record" onclick="toggleRecord()" disabled>🎙 Start Recording</button>
            <button id="btn-reset" class="sm" onclick="resetAll()">Reset</button>
            <span class="mic-timer" id="mic-timer">0:00</span>
        </div>
    </div>

    <!-- Error -->
    <div class="error-msg" id="error-msg"></div>

    <!-- Result -->
    <div class="panel" id="result-panel" style="display:none;">
        <h2>Result <button class="sm" onclick="resetAll()">Clear</button></h2>
        <div class="result-grid">

            <div class="rbox">
                <label>Transcript (STT)</label>
                <p id="res-transcript">—</p>
            </div>

            <div class="rbox">
                <label>RAG Decision</label>
                <p><span class="decision-badge none" id="res-decision">—</span></p>
            </div>

            <div class="rbox">
                <label>Similarity Score</label>
                <p class="score-val" id="res-score">—</p>
                <div class="score-wrap">
                    <div class="score-bg">
                        <div class="score-fill" id="res-score-bar" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <div class="rbox" id="res-clarify-box" style="display:none;">
                <label>Clarification Questions</label>
                <ul class="clarify-list" id="res-clarify-list"></ul>
            </div>

            <div class="rbox span2">
                <label>Answer</label>
                <p id="res-answer">—</p>
            </div>

            <div class="rbox span2" id="res-audio-box" style="display:none;">
                <label>Audio Response (TTS)</label>
                <audio id="res-audio" controls></audio>
            </div>

        </div>
    </div>

<script>
// ─── WebSocket ────────────────────────────────────────────────────────────────
let ws = null;
let audioObjectUrl = null;

function wsConnect() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${scheme}://${location.host}/ws/voice-chat`;
    setStatus('connecting', '● Connecting…');
    ws = new WebSocket(url);

    ws.onopen = () => {};

    ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        handleServerMsg(msg);
    };

    ws.onclose = () => {
        setStatus('disconnected', '● Disconnected');
        setRecordBtn(false);
        // auto-reconnect after 2s
        setTimeout(wsConnect, 2000);
    };

    ws.onerror = () => setStatus('error', '● Connection error');
}

function handleServerMsg(msg) {
    switch (msg.type) {
        case 'connected':
            setStatus('ready', '● Ready');
            setRecordBtn(true);
            break;

        case 'processing':
            setStatus('processing', '● Processing…');
            animatePipeline();
            break;

        case 'result':
            setPipelineDone();
            setStatus('ready', '● Ready');
            renderResult(msg);
            setRecordBtn(true);
            break;

        case 'error':
            setPipelineReset();
            setStatus('error', '● Error');
            showError(msg.message || 'Unknown error');
            setRecordBtn(true);
            break;
    }
}

// ─── Recording ────────────────────────────────────────────────────────────────
let audioCtx = null, stream = null, proc = null;
let recording = false, timerInterval = null, seconds = 0;

async function toggleRecord() {
    if (recording) await stopRecording();
    else await startRecording();
}

async function startRecording() {
    hideError();
    resetResult();
    setPipelineReset();

    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
    } catch (err) {
        showError('Microphone access denied: ' + err.message);
        return;
    }

    audioCtx = new AudioContext({ sampleRate: 16000 });
    const src = audioCtx.createMediaStreamSource(stream);
    proc = audioCtx.createScriptProcessor(4096, 1, 1);

    proc.onaudioprocess = (evt) => {
        if (!recording || ws?.readyState !== WebSocket.OPEN) return;
        const i16 = float32ToInt16(evt.inputBuffer.getChannelData(0));
        ws.send(i16.buffer);
    };

    src.connect(proc);
    proc.connect(audioCtx.destination);

    recording = true;
    seconds = 0;
    timerInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60);
        const s = String(seconds % 60).padStart(2, '0');
        const t = document.getElementById('mic-timer');
        t.textContent = `${m}:${s}`;
        t.classList.add('active');
    }, 1000);

    setStatus('recording', '● Recording');
    const btn = document.getElementById('btn-record');
    btn.textContent = '⏹ Stop & Send';
    btn.classList.add('rec');
}

async function stopRecording() {
    recording = false;
    clearInterval(timerInterval);
    document.getElementById('mic-timer').classList.remove('active');
    document.getElementById('mic-timer').textContent = '0:00';

    if (proc)   { proc.disconnect(); proc = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { await audioCtx.close(); audioCtx = null; }

    // Trigger pipeline
    if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'turn_end' }));
        document.getElementById('btn-record').disabled = true;
    }

    const btn = document.getElementById('btn-record');
    btn.textContent = '🎙 Start Recording';
    btn.classList.remove('rec');
}

// ─── Pipeline visualizer ──────────────────────────────────────────────────────
const STEPS = ['stt', 'embed', 'vector', 'rag', 'tts'];
let pipeAnimInterval = null;

function animatePipeline() {
    clearInterval(pipeAnimInterval);
    STEPS.forEach(s => document.getElementById('step-' + s).className = 'pipe-node');
    let i = 0;
    pipeAnimInterval = setInterval(() => {
        if (i > 0) document.getElementById('step-' + STEPS[i - 1]).classList.add('done');
        if (i < STEPS.length) document.getElementById('step-' + STEPS[i]).classList.add('active');
        i++;
        if (i > STEPS.length) clearInterval(pipeAnimInterval);
    }, 500);
}

function setPipelineDone() {
    clearInterval(pipeAnimInterval);
    STEPS.forEach(s => {
        const el = document.getElementById('step-' + s);
        el.className = 'pipe-node done';
    });
}

function setPipelineReset() {
    clearInterval(pipeAnimInterval);
    STEPS.forEach(s => document.getElementById('step-' + s).className = 'pipe-node');
}

// ─── Render result ────────────────────────────────────────────────────────────
function renderResult(data) {
    document.getElementById('res-transcript').textContent = data.transcript || '—';

    const dec = (data.decision || '').toLowerCase();
    const badge = document.getElementById('res-decision');
    badge.textContent = dec || '—';
    badge.className = 'decision-badge ' + (dec || 'none');

    const score = data.top1_score ?? 0;
    document.getElementById('res-score').textContent = score.toFixed(4);
    const bar = document.getElementById('res-score-bar');
    bar.style.width = (Math.min(score, 1) * 100) + '%';
    bar.style.background = score >= 0.76 ? '#3fb950' : score >= 0.65 ? '#e3b341' : '#388bfd';

    document.getElementById('res-answer').textContent = data.answer || '—';

    const clarifyBox = document.getElementById('res-clarify-box');
    if (dec === 'clarify' && data.clarification_questions?.length) {
        document.getElementById('res-clarify-list').innerHTML =
            data.clarification_questions.map(q => `<li>${escHtml(q)}</li>`).join('');
        clarifyBox.style.display = 'block';
    } else {
        clarifyBox.style.display = 'none';
    }

    if (audioObjectUrl) { URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }
    const audioBox = document.getElementById('res-audio-box');
    const audioEl  = document.getElementById('res-audio');
    if (data.audio_b64) {
        const bytes = base64ToUint8(data.audio_b64);
        const blob = new Blob([bytes], { type: 'audio/mpeg' });
        audioObjectUrl = URL.createObjectURL(blob);
        audioEl.src = audioObjectUrl;
        audioBox.style.display = 'block';
        audioEl.play().catch(() => {});
    } else {
        audioBox.style.display = 'none';
    }

    document.getElementById('result-panel').style.display = 'block';
}

function resetResult() {
    document.getElementById('result-panel').style.display = 'none';
    if (audioObjectUrl) { URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }
}

function resetAll() {
    resetResult();
    hideError();
    setPipelineReset();
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function setStatus(cls, text) {
    const el = document.getElementById('status-badge');
    el.className = cls;
    el.textContent = text;
}

function setRecordBtn(enabled) {
    document.getElementById('btn-record').disabled = !enabled;
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('error-msg').style.display = 'none';
}

// ─── Audio helpers ────────────────────────────────────────────────────────────
function float32ToInt16(f32) {
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
        const s = Math.max(-1, Math.min(1, f32[i]));
        i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return i16;
}

function base64ToUint8(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
}

function escHtml(str) {
    return str.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
wsConnect();
</script>
</body>
</html>
