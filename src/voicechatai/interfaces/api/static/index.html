<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Chat AI</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 820px;
            margin: 0 auto;
            padding: 16px 16px 0;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #e6edf3;
        }
        #status-badge {
            font-size: 0.8rem;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        #status-badge.disconnected { background: #21262d; color: #6e7681; }
        #status-badge.connecting   { background: #1f3a4a; color: #388bfd; animation: pulse 1s infinite; }
        #status-badge.ready        { background: #1f4a2f; color: #3fb950; }
        #status-badge.recording    { background: #4a1f1f; color: #f85149; animation: pulse 1s infinite; }
        #status-badge.processing   { background: #1f3a4a; color: #388bfd; animation: pulse 1s infinite; }
        #status-badge.ended        { background: #2d1f4a; color: #bc8cff; }
        #status-badge.error        { background: #4a261f; color: #f0883e; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

        /* ── Pipeline ── */
        .pipeline-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
            row-gap: 6px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .pipe-node {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 0.74rem;
            font-weight: 600;
            color: #6e7681;
            white-space: nowrap;
            transition: background 0.25s, color 0.25s, border-color 0.25s;
        }
        .pipe-node.active {
            background: #1f3a4a; border-color: #388bfd; color: #79c0ff;
            animation: pulse 1s infinite;
        }
        .pipe-node.done { background: #1f4a2f; border-color: #3fb950; color: #56d364; animation: none; }
        .pipe-arrow { color: #30363d; padding: 0 5px; font-size: 0.9rem; user-select: none; }

        /* ── Intent monitor ── */
        #intent-monitor {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        #intent-monitor .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6e7681;
            white-space: nowrap;
        }
        #intent-pill {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 18px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        #intent-pill.CONTINUE { background: #1f4a2f; color: #3fb950; border-color: #3fb95055; }
        #intent-pill.REPLAY   { background: #3a2f00; color: #e3b341; border-color: #e3b34155; }
        #intent-pill.STOP     { background: #2d1f4a; color: #bc8cff; border-color: #bc8cff55; }
        #intent-pill.idle     { background: #21262d; color: #6e7681; border-color: transparent; }
        #intent-pill.CONTINUE.flash, #intent-pill.REPLAY.flash, #intent-pill.STOP.flash {
            animation: intentFlash 0.4s ease-out;
        }
        @keyframes intentFlash {
            0%   { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        #intent-meta {
            font-size: 0.75rem;
            color: #6e7681;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        #intent-meta span { white-space: nowrap; }
        #intent-meta .val { color: #c9d1d9; font-weight: 600; }

        /* ── Chat window ── */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .turn { display: flex; flex-direction: column; gap: 4px; }

        .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.55;
            word-break: break-word;
        }
        .bubble.user {
            align-self: flex-end;
            background: #1f6feb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.user.silence {
            background: #21262d;
            color: #6e7681;
            font-style: italic;
        }
        .bubble.ai {
            align-self: flex-start;
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-bottom-left-radius: 4px;
        }
        .bubble.ai.replay {
            background: #3a2f00;
            border-color: #e3b341;
            color: #e3b341;
        }
        .bubble.ai.stop {
            background: #2d1f4a;
            border-color: #bc8cff;
            color: #bc8cff;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: #6e7681;
            padding: 0 4px;
        }
        .meta.right { justify-content: flex-end; }

        .intent-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .intent-badge.CONTINUE { background: #1f4a2f; color: #3fb950; }
        .intent-badge.REPLAY   { background: #3a2f00; color: #e3b341; }
        .intent-badge.STOP     { background: #2d1f4a; color: #bc8cff; }

        .rag-badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .rag-badge.hit      { background: #1f4a2f; color: #3fb950; }
        .rag-badge.clarify  { background: #3a2f00; color: #e3b341; }
        .rag-badge.fallback { background: #1f2a4a; color: #79c0ff; }
        .rag-badge.silence  { background: #21262d; color: #6e7681; }

        .audio-mini {
            margin-top: 6px;
            width: 100%;
            max-width: 340px;
            accent-color: #388bfd;
            height: 28px;
        }

        /* ── Session end banner ── */
        #session-end-banner {
            display: none;
            background: #1a1030;
            border: 1px solid #bc8cff;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.84rem;
            color: #bc8cff;
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        /* ── Error ── */
        #error-msg {
            display: none;
            background: #2d1414;
            border: 1px solid #da3633;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.82rem;
            color: #f85149;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        /* ── Controls ── */
        .controls-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-radius: 0 0 10px 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        button {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 8px 18px;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background: #30363d; border-color: #8b949e; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }
        button.primary  { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
        button.primary:hover:not(:disabled) { background: #388bfd; border-color: #388bfd; }
        button.rec      { background: #4a1f1f; border-color: #f85149; color: #ffa198; font-weight: 600; }
        button.sm       { padding: 4px 10px; font-size: 0.75rem; }

        .mic-timer {
            font-family: 'Consolas', monospace;
            font-size: 0.88rem;
            color: #6e7681;
            min-width: 38px;
        }
        .mic-timer.active { color: #f85149; }

        .spacer { flex: 1; }

        #btn-clear { opacity: 0.5; }
        #btn-clear:hover { opacity: 1; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>🎙 Voice Chat AI</h1>
        <span id="status-badge" class="disconnected">● Disconnected</span>
    </div>

    <!-- Pipeline bar -->
    <div class="pipeline-bar">
        <div class="pipe-node" id="step-stt">STT</div>
        <span class="pipe-arrow">→</span>
        <div class="pipe-node" id="step-embed">Embed</div>
        <span class="pipe-arrow">→</span>
        <div class="pipe-node" id="step-vector">Vector DB</div>
        <span class="pipe-arrow">→</span>
        <div class="pipe-node" id="step-rag">RAG</div>
        <span class="pipe-arrow">→</span>
        <div class="pipe-node" id="step-llm">LLM + Intent</div>
        <span class="pipe-arrow">→</span>
        <div class="pipe-node" id="step-tts">TTS</div>
    </div>

    <!-- Intent monitor -->
    <div id="intent-monitor">
        <span class="label">Intent</span>
        <span id="intent-pill" class="idle">—</span>
        <div id="intent-meta">
            <span>RAG: <span class="val" id="im-rag">—</span></span>
            <span>Score: <span class="val" id="im-score">—</span></span>
            <span>Turn: <span class="val" id="im-turn">0</span></span>
        </div>
    </div>

    <!-- Chat -->
    <div id="chat"></div>

    <!-- Session end banner -->
    <div id="session-end-banner">🔴 Session ended. Refresh the page to start a new conversation.</div>

    <!-- Error -->
    <div id="error-msg"></div>

    <!-- Controls -->
    <div class="controls-bar">
        <button class="primary" id="btn-record" onclick="toggleRecord()" disabled>🎙 Start Recording</button>
        <span class="mic-timer" id="mic-timer">0:00</span>
        <div class="spacer"></div>
        <button class="sm" id="btn-clear" onclick="clearChat()">Clear chat</button>
    </div>

<script>
// ─── WebSocket ────────────────────────────────────────────────────────────────
let ws = null;
let sessionEnded = false;

function wsConnect() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${scheme}://${location.host}/ws/voice-chat`);
    setStatus('connecting', '● Connecting…');

    ws.onopen = () => {};

    ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        handleServerMsg(msg);
    };

    ws.onclose = () => {
        if (sessionEnded) return;
        setStatus('disconnected', '● Disconnected');
        setRecordBtn(false);
        setTimeout(wsConnect, 2000);
    };

    ws.onerror = () => setStatus('error', '● Error');
}

function handleServerMsg(msg) {
    switch (msg.type) {
        case 'connected':
            setStatus('ready', '● Ready');
            setRecordBtn(true);
            break;

        case 'processing':
            setStatus('processing', '● Processing…');
            animatePipeline();
            break;

        case 'result':
            setPipelineDone();
            setStatus('ready', '● Ready');
            updateIntentMonitor(msg);
            appendAIBubble(msg);
            setRecordBtn(true);
            break;

        case 'session_end':
            setPipelineDone();
            updateIntentMonitor({ ...msg, intent: 'STOP', decision: 'stop' });
            appendAIBubble({ ...msg, intent: 'STOP', decision: 'stop' });
            endSession();
            break;

        case 'error':
            setPipelineReset();
            setStatus('error', '● Error');
            showError(msg.message || 'Unknown error.');
            setRecordBtn(true);
            break;
    }
}

// ─── Recording ────────────────────────────────────────────────────────────────
let audioCtx = null, stream = null, proc = null;
let recording = false, timerInterval = null, seconds = 0;
let pendingUserBubble = null;

async function toggleRecord() {
    if (recording) await stopRecording();
    else await startRecording();
}

async function startRecording() {
    hideError();
    setPipelineReset();

    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
    } catch (err) {
        showError('Microphone access denied: ' + err.message);
        return;
    }

    audioCtx = new AudioContext({ sampleRate: 16000 });
    const src = audioCtx.createMediaStreamSource(stream);
    proc = audioCtx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = (evt) => {
        if (!recording || ws?.readyState !== WebSocket.OPEN) return;
        ws.send(float32ToInt16(evt.inputBuffer.getChannelData(0)).buffer);
    };
    src.connect(proc);
    proc.connect(audioCtx.destination);

    recording = true;
    seconds = 0;
    timerInterval = setInterval(() => {
        seconds++;
        const t = document.getElementById('mic-timer');
        t.textContent = `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
        t.classList.add('active');
    }, 1000);

    setStatus('recording', '● Recording');
    const btn = document.getElementById('btn-record');
    btn.textContent = '⏹ Stop & Send';
    btn.classList.remove('primary');
    btn.classList.add('rec');
}

async function stopRecording() {
    recording = false;
    clearInterval(timerInterval);
    const t = document.getElementById('mic-timer');
    t.classList.remove('active');
    t.textContent = '0:00';

    if (proc)     { proc.disconnect(); proc = null; }
    if (stream)   { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { await audioCtx.close(); audioCtx = null; }

    const btn = document.getElementById('btn-record');
    btn.textContent = '🎙 Start Recording';
    btn.classList.remove('rec');
    btn.classList.add('primary');
    btn.disabled = true;

    if (ws?.readyState === WebSocket.OPEN) {
        // Optimistically show user bubble — will be replaced/annotated on result
        pendingUserBubble = appendUserBubble(seconds > 0 ? null : 'silence');
        ws.send(JSON.stringify({ type: 'turn_end' }));
    }
}

// ─── Intent monitor ───────────────────────────────────────────────────────────
let turnCount = 0;

function updateIntentMonitor(msg) {
    const intent  = (msg.intent  || 'CONTINUE').toUpperCase();
    const decision = (msg.decision || '—').toLowerCase();
    const score   = msg.top1_score != null ? msg.top1_score.toFixed(3) : '—';

    turnCount++;
    const pill = document.getElementById('intent-pill');
    pill.className = intent;           // sets colour
    pill.textContent = intent;

    // Flash animation — remove then re-add class to restart
    pill.classList.remove('flash');
    void pill.offsetWidth;             // force reflow
    pill.classList.add('flash');

    document.getElementById('im-rag').textContent   = decision;
    document.getElementById('im-score').textContent = score;
    document.getElementById('im-turn').textContent  = turnCount;
}

function resetIntentMonitor() {
    const pill = document.getElementById('intent-pill');
    pill.className = 'idle';
    pill.textContent = '—';
    document.getElementById('im-rag').textContent   = '—';
    document.getElementById('im-score').textContent = '—';
    document.getElementById('im-turn').textContent  = turnCount;
}

// ─── Chat bubbles ─────────────────────────────────────────────────────────────
function appendUserBubble(transcript) {
    const turn = document.createElement('div');
    turn.className = 'turn';

    const meta = document.createElement('div');
    meta.className = 'meta right';
    meta.textContent = 'You';

    const bubble = document.createElement('div');
    bubble.className = 'bubble user' + (transcript === 'silence' ? ' silence' : '');
    bubble.textContent = transcript === 'silence' ? '(silence)' : (transcript || '…');

    turn.appendChild(meta);
    turn.appendChild(bubble);
    document.getElementById('chat').appendChild(turn);
    scrollChat();
    return { turn, bubble };
}

function appendAIBubble(msg) {
    // Update pending user bubble with real transcript
    if (pendingUserBubble) {
        const transcript = msg.transcript || '';
        if (!transcript.trim()) {
            pendingUserBubble.bubble.className = 'bubble user silence';
            pendingUserBubble.bubble.textContent = '(silence)';
        } else {
            pendingUserBubble.bubble.textContent = transcript;
        }
        pendingUserBubble = null;
    }

    if (!msg.answer) return;

    const intent  = (msg.intent  || 'CONTINUE').toUpperCase();
    const decision = (msg.decision || '').toLowerCase();

    const turn = document.createElement('div');
    turn.className = 'turn';

    // Meta row
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `
        <span>AI</span>
        <span class="rag-badge ${decision}">${decision || '—'}</span>
        <span class="intent-badge ${intent}">${intent}</span>
        ${msg.top1_score ? `<span>${(msg.top1_score).toFixed(3)}</span>` : ''}
    `;

    // Bubble
    const bubble = document.createElement('div');
    const intentClass = intent === 'REPLAY' ? ' replay' : intent === 'STOP' ? ' stop' : '';
    bubble.className = 'bubble ai' + intentClass;
    bubble.textContent = msg.answer;

    // Audio player
    if (msg.audio_b64) {
        const bytes = base64ToUint8(msg.audio_b64);
        const blob  = new Blob([bytes], { type: 'audio/wav' });
        const url   = URL.createObjectURL(blob);
        const audio = document.createElement('audio');
        audio.className = 'audio-mini';
        audio.controls  = true;
        audio.src       = url;
        bubble.appendChild(audio);
        audio.play().catch(() => {});
    }

    turn.appendChild(meta);
    turn.appendChild(bubble);
    document.getElementById('chat').appendChild(turn);
    scrollChat();
}

function scrollChat() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
    document.getElementById('chat').innerHTML = '';
    hideError();
    setPipelineReset();
}

// ─── Session end ──────────────────────────────────────────────────────────────
function endSession() {
    sessionEnded = true;
    setStatus('ended', '● Session ended');
    setRecordBtn(false);
    document.getElementById('session-end-banner').style.display = 'block';
    ws?.close();
}

// ─── Pipeline ─────────────────────────────────────────────────────────────────
const STEPS = ['stt', 'embed', 'vector', 'rag', 'llm', 'tts'];
let pipeTimer = null;

function animatePipeline() {
    clearInterval(pipeTimer);
    STEPS.forEach(s => document.getElementById('step-' + s).className = 'pipe-node');
    let i = 0;
    pipeTimer = setInterval(() => {
        if (i > 0) document.getElementById('step-' + STEPS[i-1]).classList.add('done');
        if (i < STEPS.length) document.getElementById('step-' + STEPS[i]).classList.add('active');
        i++;
        if (i > STEPS.length) clearInterval(pipeTimer);
    }, 400);
}

function setPipelineDone() {
    clearInterval(pipeTimer);
    STEPS.forEach(s => document.getElementById('step-' + s).className = 'pipe-node done');
}

function setPipelineReset() {
    clearInterval(pipeTimer);
    STEPS.forEach(s => document.getElementById('step-' + s).className = 'pipe-node');
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function setStatus(cls, text) {
    const el = document.getElementById('status-badge');
    el.className = cls;
    el.textContent = text;
}

function setRecordBtn(enabled) {
    const btn = document.getElementById('btn-record');
    btn.disabled = !enabled;
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('error-msg').style.display = 'none';
}

// ─── Audio helpers ────────────────────────────────────────────────────────────
function float32ToInt16(f32) {
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
        const s = Math.max(-1, Math.min(1, f32[i]));
        i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return i16;
}

function base64ToUint8(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
wsConnect();
</script>
</body>
</html>
